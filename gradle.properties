org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 命令行构建时如果报 JDK 版本不对（PATH 里默认是 JDK 25），取消下面这行
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21.0.11

# --- TLS ---
# 把 Java 侧的 TLS 协议收窄到 1.2/1.3，绕过某些中间设备对握手的干扰
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3

# --- 代理（实测本机代理连不上 neoforged，所以默认关闭）---
# 如果以后要启用，取消注释并把端口改成你的：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

# --- mod identity ---
mod_id=sunflare
mod_name=Sunflare Solar
mod_license=MIT
mod_version=0.6.0-beta
mod_group_id=dev.sunflare

# --- platform ---
# NeoForge 21.1.x 对应 Minecraft 1.21.1 / Java 21
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)
